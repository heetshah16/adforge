packages:
  - packages/*
  - packages/providers/*
  - apps/*

saveExact: true

# Every third-party version lives here, exact. Upgrades are deliberate PRs.
catalog:
  typescript: 7.0.2
  turbo: 2.11.8
  vitest: 5.0.4
  zod: 4.6.7
  tsx: 4.23.15
  "@types/node": 26.6.5
  drizzle-orm: 0.45.4
  drizzle-kit: 0.31.11
  "@electric-sql/pglite": 0.5.8
  postgres: 3.4.9
  "@hyperframes/producer": 0.8.106
  "@hyperframes/engine": 0.8.106
  gsap: 3.15.0
  "@fontsource/inter": 5.3.0
  "@fontsource/noto-sans-devanagari": 5.3.0
  "@anthropic-ai/claude-agent-sdk": 0.3.287
  "@anthropic-ai/sdk": 0.131.0
  "@modelcontextprotocol/sdk": 1.31.0
  inngest: 4.21.1
  inngest-cli: 1.45.1
  next: 16.3.8
  react: 19.3.0
  react-dom: 19.3.0
  "@playwright/test": 1.63.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@supabase/ssr": 0.12.7
  "@supabase/supabase-js": 2.117.2

allowBuilds:
  esbuild: true
  puppeteer: true
  # Transitive via inngest's OpenTelemetry gRPC exporters; its postinstall is a banner only.
  protobufjs: false
  # Postinstall fetches the Inngest dev-server binary.
  inngest-cli: true

overrides:
  "@hyperframes/core": 0.8.106
  "@hyperframes/engine": 0.8.106
  "@hyperframes/lint": 0.8.106
  "@hyperframes/parsers": 0.8.106
  "@hyperframes/studio-server": 0.8.106
